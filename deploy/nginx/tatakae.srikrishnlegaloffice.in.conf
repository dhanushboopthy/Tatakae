# Install as /etc/nginx/sites-available/tatakae.srikrishnlegaloffice.in and symlink into sites-enabled.
# This is the HTTP-only starting point. `certbot --nginx -d tatakae.srikrishnlegaloffice.in --redirect` adds the
# port 443 block, the certificate paths and the http -> https redirect to the installed copy.
# Website: apps/web/dist (needs /home/tatakae to be mode 711). API: 127.0.0.1:8791 (not 8787, another site uses it).
server {
    listen 80;
    listen [::]:80;
    server_name tatakae.srikrishnlegaloffice.in;

    root /home/tatakae/TATAKAE/apps/web/dist;
    server_tokens off;
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location /api/ {
        include snippets/tatakae-headers.conf;
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        include snippets/tatakae-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include snippets/tatakae-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
