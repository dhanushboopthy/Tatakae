#cloud-config
# Ubuntu 24.04 aarch64 on VM.Standard.A1.Flex (2 OCPU / 12 GB = the whole Always Free A1 allowance).
#
# This file is a Terraform template, rendered by templatefile() in infra/terraform/main.tf with:
#   bootstrap_script_b64  deploy/scripts/bootstrap.sh, base64-encoded
#   tailscale_auth_key    one-off auth key (may be empty)
#   tailscale_hostname    machine name on the tailnet
#   admin_user            default login user (ubuntu)
# Template rules: a literal dollar-brace must be written as $${ and a literal percent-brace as %%{.
# Keep shell logic in bootstrap.sh (it is also the manual path for an existing VM), not here.

package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - gnupg
  - jq
  - sqlite3

write_files:
  # The same script you would run by hand: sudo /usr/local/sbin/tatakae-bootstrap
  - path: /usr/local/sbin/tatakae-bootstrap
    owner: root:root
    permissions: "0755"
    encoding: b64
    content: ${bootstrap_script_b64}

  # Read by bootstrap.sh. The auth key line is deleted once Tailscale is up.
  - path: /etc/tatakae/bootstrap.env
    owner: root:root
    permissions: "0600"
    content: |
      TATAKAE_USER=${admin_user}
      TAILSCALE_HOSTNAME=${tailscale_hostname}
      TAILSCALE_AUTH_KEY=${tailscale_auth_key}

runcmd:
  - [bash, -c, "set -o pipefail; /usr/local/sbin/tatakae-bootstrap 2>&1 | tee -a /var/log/tatakae-bootstrap.log"]

final_message: "tatakae cloud-init finished after $UPTIME seconds (see /var/log/tatakae-bootstrap.log)"
