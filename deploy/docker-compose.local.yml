# Local run of the website + API on this laptop, built from source (no GHCR, no domain, no Litestream).
#   scripts/local-up.sh            picks a free port (8080 upward) and starts everything
#   or: TATAKAE_PORT=8080 docker compose -f deploy/docker-compose.local.yml up -d --build
# Then open http://localhost:$TATAKAE_PORT. Published on 127.0.0.1 only.
#
# Auth: DEV_BYPASS_AUTH=1 by default (no login; only honoured with NODE_ENV=development). To try the
# real login, run with DEV_BYPASS_AUTH=0 OWNER_EMAIL=… OWNER_PASSWORD_HASH='$argon2…'
# (deploy/scripts/hash-password.sh). Data lives in the `tatakae_local_data` volume; `down -v` wipes it.
name: tatakae-local

services:
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: tatakae-web:local
    restart: unless-stopped
    ports: ["127.0.0.1:${TATAKAE_PORT:-8080}:80"]
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy

  # The named volume starts root-owned; the api runs as uid 1000 (`node`). Same image as api (the
  # second build is fully cached).
  data-init:
    build: &api-build
      context: ..
      dockerfile: apps/api/Dockerfile
    image: tatakae-api:local
    user: "0:0"
    entrypoint: ["sh", "-c", "mkdir -p /data/files /data/backups && chown -R 1000:1000 /data"]
    volumes:
      - data:/data

  api:
    build: *api-build
    image: tatakae-api:local
    restart: unless-stopped
    init: true
    user: "1000:1000"
    environment:
      NODE_ENV: development
      DEV_BYPASS_AUTH: ${DEV_BYPASS_AUTH:-1}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      OWNER_PASSWORD_HASH: ${OWNER_PASSWORD_HASH:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      PUBLIC_ORIGIN: http://localhost:${TATAKAE_PORT:-8080}
      DATABASE_PATH: /data/tatakae.db
      FILES_DIR: /data/files
      BACKUP_DIR: /data/backups
      TZ: Asia/Kolkata
    volumes:
      - data:/data
    expose: ["8787"]
    depends_on:
      data-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  data:
    name: tatakae_local_data
